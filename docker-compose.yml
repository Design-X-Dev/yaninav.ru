# Dev: `docker compose up` или `docker compose up --build`
services:
  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URI: file:/app/data/payload.db
      # DEV ONLY: fallback secret. Для production используйте scripts/prod-up.sh + docker-compose.prod.yml.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-local-dev-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-local-only}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./data:/app/data
    command: >-
      sh -c "npm ci && npm run payload:migrate && npx next dev --hostname 0.0.0.0"

volumes:
  node_modules:
